# Render Blueprint — defines all services needed for BookLeaf Portal
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bookleaf-portal
    runtime: node
    region: singapore        # change to oregon / frankfurt based on your users
    plan: free               # upgrade to starter ($7/mo) for always-on
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure random value
      - key: OPENAI_API_KEY
        sync: false                # You enter this manually in the Render dashboard
      - key: NEXT_PUBLIC_APP_URL
        sync: false                # You enter your Render URL here after first deploy

databases:
  - name: bookleaf-db
    databaseName: bookleaf
    user: bookleaf
    region: singapore
    plan: free                     # Free tier: 1GB, 1 month expiry — upgrade for production
